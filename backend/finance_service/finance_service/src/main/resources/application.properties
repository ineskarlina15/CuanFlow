spring.application.name=finance_service

# Pengaturan Port dan Nama Service
server.port=8022

# Konfigurasi Database PostgreSQL (Pisah dari Auth)
spring.datasource.url=jdbc:postgresql://localhost:5432/db_cuanflow
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ines123}

# Konfigurasi JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret
jwt.secret=${JWT_SECRET:SecretKeyCuanFlowS1AkuntansiYangSangatPanjangDanAman123!}